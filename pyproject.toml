[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alteryx2fabric"
version = "0.1.0"
description = "Toolkit for migrating Alteryx workflows to Microsoft Fabric (Lakehouse + Notebooks + Data Pipelines)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "alteryx2fabric contributors" }]
keywords = ["alteryx", "fabric", "onelake", "delta", "migration", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
a2f = "alteryx2fabric.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/alteryx2fabric"
Issues   = "https://github.com/your-org/alteryx2fabric/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alteryx2fabric = ["templates/*.py", "templates/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"
